name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      OPENAI_API_KEY: test-key
      LLM_PROVIDER: langchain_openai
      DATA_DIR: data
      CONVERSATION_BACKEND: sqlite
      PAPER_STORE_BACKEND: sqlite
      VECTOR_STORE_BACKEND: chroma
      INGESTION_JOB_BACKEND: memory
      BGE_PRELOAD_ON_STARTUP: "false"
      READINESS_CHECK_VECTOR_STORE: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall app scripts evaluate.py

      - name: Run unit tests
        run: pytest -q

      - name: Run planner evaluation
        run: python -m scripts.evaluate_dynamic_planner

      - name: Run compact agent evaluation
        run: python evaluate.py

  docker-build-push:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with: 
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      
      - name: Build Docker Image
        run: |
          docker build \
            -t khoatran1/agentic-research-assistant:latest .

      - name: Push Docker Image
        run: |
          docker push \
            khoatran1/agentic-research-assistant:latest